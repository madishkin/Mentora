version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: educraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: educraft
      POSTGRES_PASSWORD: educraft_pass
      POSTGRES_DB: educraft
    ports:
      - "5433:5432"
    volumes:
      - educraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: educraft_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - educraft_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  educraft_pgdata:
  educraft_redisdata:
